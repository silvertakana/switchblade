name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run is dead weight: cancel it so the newest commit owns the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only pipeline, so ask for nothing more than the checkout.
permissions:
  contents: read

jobs:
  # S1-S5 and S7: the checks that need no child router. They run once, on the
  # oldest supported Node, because none of them depends on the Node version.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks (S1-S5, S7)
        run: node scripts/ci/check.mjs static

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check
        run: node --check server.mjs && node --check test.mjs
      - name: Suite contract (S6)
        run: node scripts/ci/check.mjs suite

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets
        run: |
          set -e
          # Fail if any secret-like pattern appears in tracked files.
          # .env and logs are gitignored and never present in CI checkout.
          if grep -rInE \
            "sk-[a-zA-Z0-9]{16,}|user_[a-zA-Z0-9]{16,}|ghp_[a-zA-Z0-9]{20,}|gho_[a-zA-Z0-9]{20,}|AIza[a-zA-Z0-9_-]{20,}|xox[baprs]-[a-zA-Z0-9-]{10,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE|AKIA[0-9A-Z]{16}" \
            --exclude-dir=.git --exclude-dir=node_modules --exclude=.env .; then
            echo "::error::Secret-like pattern found in tracked files. Check the output above."
            exit 1
          fi
          echo "No secret-like patterns found."
      - name: Verify .env.example has no real values
        run: |
          set -e
          # .env.example must only contain empty placeholders (KEY= or KEY= with no value).
          if grep -E '^[A-Z_]+=.+' .env.example; then
            echo "::error::.env.example contains a non-empty value. It must be placeholders only."
            exit 1
          fi
          echo ".env.example placeholders are clean."

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t switchblade:ci .
